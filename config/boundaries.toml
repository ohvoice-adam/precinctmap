# Boundary registry. `precinctmap boundaries load` makes the store match this file.
# Paths are relative to PRECINCTMAP_DATA_DIR. Dates: valid_from inclusive, valid_to exclusive.
# native_from = the date a set actually took effect; lookups before it are labeled retroactive.
# Changing an entry changes its fingerprint; reload it with `--replace <id>`.

county = "Franklin"

[blocks]
source = "boundaries/tiger_dl/tl_2020_39_tabblock20.zip"
where = "COUNTYFP20 = '049'"
vintage = 2020
id_field = "GEOID20"
pop_field = "POP20"
housing_field = "HOUSING20"

# --- Area water: subtracted from each feature's polygon for its land area ----------------
# (registered voters per square mile). Lakes, ponds, reservoirs and wide rivers (MTFCC H2030,
# H2040, H3010, H3020); 3,126 polygons, 11.19 sq mi in the 2026 file.
[water]
source = "boundaries/tiger_dl/tl_2026_39049_areawater.zip"
vintage = 2026

# --- County outline (first: other sets clip to it) -----------------------------------

[[sets]]
id = "franklin-county-2026"
geography = "county"
source = "boundaries/tiger_dl/tl_2026_us_county.zip"
where = "GEOID = '39049'"
id_field = "GEOID"
name_template = "{NAMELSAD}"
valid_from = 2000-01-01
notes = "TIGER 2026 county outline; clip mask and context only."

# --- Precincts -------------------------------------------------------------------------

[[sets]]
id = "franklin-precincts-2025-07"
geography = "precinct"
source = "boundaries/franklin_precincts_2026/VotingPrecinct.shp"
id_field = "NAME"
code_field = "PRECINCTID"  # BOE code used by the voter file
valid_from = 2025-07-30
native_from = 2025-07-30
notes = "Franklin County BOE voting precincts; created 2025-07-30, last edited 2025-09-18."

[[sets]]
id = "franklin-precincts-2025-07-retro"
geography = "precinct"
derive = "merge_precincts"
from = "franklin-precincts-2025-07"
merge = { "HAMILTON-A" = ["HAMILTON-A", "OBETZ-D"] }
valid_from = 2000-01-01  # any earlier election, for now (decision 2026-10-22)
valid_to = 2025-07-30
native_from = 2025-07-30
notes = """No older precinct file can be obtained, so the 2025 file is applied retroactively. \
OBETZ-D was carved from HAMILTON-A after the May 2025 primary, so they are merged here."""

# --- Municipalities and townships (exact by precinct name prefix) ----------------------

[[sets]]
id = "franklin-municipalities-2025-07"
geography = "municipality"
derive = "precinct_jurisdictions"
from = "franklin-precincts-2025-07"
places = "boundaries/tl_2026_39_place.zip"
county_subdivisions = "boundaries/tiger_dl/tl_2026_39_cousub.zip"
carve_places = ["Brice", "Harrisburg", "Lithopolis", "Lockbourne", "Pickerington"]
aliases = { "GRANDVIEW" = "Grandview Heights" }
valid_from = 2025-07-30
native_from = 2025-07-30
notes = """Dissolved precincts by name prefix. Villages with no precincts of their own are cut \
out of their host township with TIGER 2026 place boundaries (allocated by block population)."""

[[sets]]
id = "franklin-municipalities-2025-07-retro"
geography = "municipality"
derive = "precinct_jurisdictions"
from = "franklin-precincts-2025-07-retro"
places = "boundaries/tl_2026_39_place.zip"
county_subdivisions = "boundaries/tiger_dl/tl_2026_39_cousub.zip"
carve_places = ["Brice", "Harrisburg", "Lithopolis", "Lockbourne", "Pickerington"]
aliases = { "GRANDVIEW" = "Grandview Heights" }
valid_from = 2000-01-01
valid_to = 2025-07-30
native_from = 2025-07-30
notes = "Same derivation from the retroactive precinct set."

# --- Wards (exact by precinct name prefix with ward number) ------------------------------
[[sets]]
id = "franklin-wards-2025-07"
geography = "ward"
derive = "precinct_wards"
from = "franklin-precincts-2025-07"
places = "boundaries/tl_2026_39_place.zip"
county_subdivisions = "boundaries/tiger_dl/tl_2026_39_cousub.zip"
aliases = { "GRANDVIEW" = "Grandview Heights" }
valid_from = 2025-07-30
native_from = 2025-07-30
notes = """Precincts dissolved by name prefix: COLUMBUS 01-A and 01-B form Columbus Ward 01. \
Jurisdictions whose precincts have no ward number (BLENDON-A) are one area each."""

[[sets]]
id = "franklin-wards-2025-07-retro"
geography = "ward"
derive = "precinct_wards"
from = "franklin-precincts-2025-07-retro"
places = "boundaries/tl_2026_39_place.zip"
county_subdivisions = "boundaries/tiger_dl/tl_2026_39_cousub.zip"
aliases = { "GRANDVIEW" = "Grandview Heights" }
valid_from = 2000-01-01
valid_to = 2025-07-30
native_from = 2025-07-30
notes = "Same derivation from the retroactive precinct set."

# --- Columbus council districts ---------------------------------------------------------

[[sets]]
id = "columbus-council-districts-2023"
geography = "council_district"
source = "boundaries/Columbus_City_Council_Districts.geojson"
id_field = "DISTRICT"
name_template = "District {DISTRICT}"
jurisdiction = "COLUMBUS"
valid_from = 2000-01-01  # earlier elections use it retroactively (labeled), for now
native_from = 2023-01-01
notes = "The original and current district map (first used 2023). File last edited 2024-11-26."

# --- ZIP code areas -----------------------------------------------------------------------

[[sets]]
id = "zcta-2020-franklin"
geography = "zcta"
source = "boundaries/tl_2026_us_zcta520.zip"
id_field = "ZCTA5CE20"
name_template = "ZIP {ZCTA5CE20}"
clip_to_county = true
valid_from = 2000-01-01
notes = "Census ZCTA5 (2020 definitions, TIGER 2026), clipped to the Franklin County portion."

# --- Ohio legislative districts (Franklin County portion; TIGER state legislative units) ---
# Three Ohio maps: 2011 (to 2022), 2022 (Aug 2022 - 2023), 2024 on. Windows are election dates.
# Districts reach outside the county, so each is clipped to Franklin and shown as that portion.

[[sets]]
id = "ohio-house-2011"
geography = "state_house"
source = "boundaries/tiger_dl/tl_2020_39_sldl.zip"
where = "SLDLST <> 'ZZZ'"
id_field = "SLDLST"
name_template = "House District {SLDLST}"
clip_to_county = true
min_area_sqmi = 0.05  # drops slivers where district edges meet the county outline
valid_from = 2000-01-01
valid_to = 2022-08-02
native_from = 2012-01-01
notes = "Ohio 2011 map (TIGER 2020), in use for the 2012-2020 elections; earlier elections use it retroactively."

[[sets]]
id = "ohio-house-2022"
geography = "state_house"
source = "boundaries/tiger_dl/tl_2022_39_sldl.zip"
where = "SLDLST <> 'ZZZ'"
id_field = "SLDLST"
name_template = "House District {SLDLST}"
clip_to_county = true
min_area_sqmi = 0.05  # drops slivers where district edges meet the county outline
valid_from = 2022-08-02
valid_to = 2024-03-19
native_from = 2022-08-02
notes = "Ohio 2022 map (TIGER 2022), first used in the August 2022 primary."

[[sets]]
id = "ohio-house-2024"
geography = "state_house"
source = "boundaries/tiger_dl/tl_2026_39_sldl.zip"
where = "SLDLST <> 'ZZZ'"
id_field = "SLDLST"
name_template = "House District {SLDLST}"
clip_to_county = true
min_area_sqmi = 0.05  # drops slivers where district edges meet the county outline
valid_from = 2024-03-19
native_from = 2024-03-19
notes = "Ohio map adopted September 2023 (TIGER 2026), first used in the March 2024 primary."

[[sets]]
id = "ohio-senate-2011"
geography = "state_senate"
source = "boundaries/tiger_dl/tl_2020_39_sldu.zip"
where = "SLDUST <> 'ZZZ'"
